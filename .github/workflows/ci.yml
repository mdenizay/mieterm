name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # Tauri needs the WebKitGTK development headers to compile on Linux. Nothing here is
      # needed at runtime by the packaged app beyond the libraries the .deb depends on.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            gnome-keyring dbus-x11

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # generate_context reads ../dist at compile time, so it has to exist before cargo runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        if: matrix.os != 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Linux keeps passwords in the Secret Service, which a headless runner does not have.
      # Starting an unlocked keyring covers the credential path here rather than skipping
      # it — it is the platform most likely to lack one in the wild.
      - name: Test (with a Secret Service)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
            cargo test --manifest-path src-tauri/Cargo.toml
          '

  ssh:
    name: Against a real sshd
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev gnome-keyring dbus-x11

      # The argument builder and the sftp client are the two pieces that can only really be
      # judged against a server. A runner-local sshd is enough to tell a working handshake
      # from a broken one, and needs no credentials from anywhere.
      - name: Start a local sshd and authorise this runner
        run: |
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes 127.0.0.1 echo "sshd reachable"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Test against it
        env:
          MIETERM_TEST_SSH_HOST: 127.0.0.1
        run: |
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1
            cargo test --manifest-path src-tauri/Cargo.toml
          '

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` type-checks with tsc before Vite bundles, so a type error fails here.
      - run: npm run build
