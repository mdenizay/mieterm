name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v1.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build rather than two, so there is a single download that
          # runs on Apple Silicon and Intel alike.
          - os: macos-15
            label: macOS (universal)
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            label: Linux (deb, rpm, AppImage)
            args: ""
          - os: windows-latest
            label: Windows (installer)
            args: ""

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check the tag matches the app version
        shell: bash
        run: |
          CONFIG_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$CONFIG_VERSION" != "${TAG#v}" ]; then
            echo "::error::Tag is $TAG but tauri.conf.json says $CONFIG_VERSION. Bump one of them."
            exit 1
          fi

      # tauri-action takes the release body as a string. Handing it a path publishes the
      # path itself, so the file is read into a step output first.
      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            cat .github/RELEASE_NOTES.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Apple's variables are exported here rather than listed under the build step's `env`,
      # and only when they actually hold something.
      #
      # A workflow that always writes `APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}`
      # defines the variable as an empty string when the secret is unset, and Tauri reads
      # "defined" as "sign with this" — it then runs `security import` on nothing and the
      # build dies with "one or more parameters were not valid". That is what happens on a
      # fork, and it happened here on the first tagged build. Leaving the variable out
      # entirely is what actually produces the intended ad-hoc signature.
      - name: Configure Apple signing, if it is configured at all
        id: apple
        if: matrix.os == 'macos-15'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "Signing with $SIGNING_IDENTITY"
          else
            echo "No signing certificate configured; the app gets an ad-hoc signature."
          fi

          # Notarisation needs all three, and notarytool wants the key as a file on disk.
          if [ -n "$API_KEY_BASE64" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then
            echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            } >> "$GITHUB_ENV"
            echo "notarise=true" >> "$GITHUB_OUTPUT"
          else
            echo "Notarisation is not configured; the build is signed but not notarised."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The APPLE_* variables are not listed here on purpose — the step above exports
          # them through $GITHUB_ENV, and only when they are set. See the note there.
          #
          # Signs the updater artifacts. Without these the update check would find a
          # release it refuses to install, which is worse than not publishing one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Mieterm ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Drafted on purpose: three jobs write to one release, so publishing on the first
          # to finish would show a release carrying only macOS files while Linux and
          # Windows are still building. The job below publishes it once they all land.
          releaseDraft: true
          prerelease: false
          # tauri-action writes latest.json from the signed artifacts of every matrix job,
          # which is exactly what the in-app updater reads.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Tauri notarises the .app, but the disk image that wraps it is only signed. A
      # downloaded .dmg with no ticket of its own is what Gatekeeper actually assesses when
      # someone double-clicks it, so without this the warning is still there on the path
      # most people take.
      - name: Notarise and staple the disk image
        if: matrix.os == 'macos-15' && steps.apple.outputs.notarise == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          echo "Notarising $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          # Fail loudly rather than shipping a disk image that still warns.
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          gh release upload "$TAG" "$DMG" --clobber

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Check every platform produced its artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort | tee assets.txt
          # A release missing a platform is worse than a late one, and latest.json is what
          # the updater reads — without it the in-app check finds nothing.
          missing=0
          for pattern in '[.]dmg$' '[.]app[.]tar[.]gz$' '[.]exe$' '[.]AppImage$' '[.]deb$' '^latest[.]json$'; do
            if ! grep -qE "$pattern" assets.txt; then
              echo "::error::No asset matching $pattern"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to publish an incomplete release."
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
